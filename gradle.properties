# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment for 1.21
parchment_minecraft_version=1.21
parchment_mappings_version=2024.07.28

# NeoForge 1.21.1
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.22)
neoforge_version=21.1.219
neoforge_version_range=[21.1.219,)

# Java 21
java_version=21

## Mod Properties
mod_id=tinkersjewelry
mod_name=Tinkers' Jewelry
mod_license=LGPLv3
mod_version=1.2.0
mod_group_id=dev.ferriarnus.tinkersjewelry
mod_authors=Ferri_Arnus
mod_description=A mod that allows you to make Curios trinkets in Tinkers' Construct.

# Mantle and TConstruct (local builds)
mantle_version=1.12
tinkers_version=3.12.0

# Dependencies
curios_version=8.0.0-beta.5
placebo_version=9.5.0
attributesLib_version=2.0.0
jei_version=19.21.+
